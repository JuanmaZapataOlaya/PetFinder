services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        VITE_TURBOVEC_URL: ${VITE_TURBOVEC_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - turbovec

  turbovec:
    build:
      context: ./turbovec-fallback
      dockerfile: Dockerfile
    env_file:
      - ./turbovec-fallback/.env
    ports:
      - "${TURBOVEC_PORT:-8001}:8001"
    volumes:
      - turbovec-data:/app/data

volumes:
  turbovec-data: